- type: entity
  parent: BaseItem
  id: MapTaurus
  name: 'map (taurus)'
  description: It's a map of Taurus, Florida. The red squares mark objectives.
  components:
    - type: Item
      size: Tiny
      storedSprite:
        sprite: _Battlefield14/Objects/Misc/maps.rsi
        state: taurus-storage
    - type: Sprite
      sprite: _Battlefield14/Objects/Misc/maps.rsi
      state: taurus
      scale: 0.7, 0.7
    - type: Paper
      contentSize: 0
    - type: PaperVisuals
      contentImagePath: "/Textures/_Battlefield14/GroundMaps/Taurus.rsi/map.png"
      contentImageTile: false
      backgroundPatchMargin: 0.0, 0.0, 0.0, 0.0
      contentMargin: 0.0, 0.0, 0.0, 0.0
      headerMargin: 0.0, 0.0, 0.0, 0.0
    - type: ActivatableUI
      key: enum.PaperUiKey.Key
      requiresComplex: false
    - type: UserInterface
      interfaces:
        enum.PaperUiKey.Key:
          type: PaperBoundUserInterface
    - type: ExtendDescription
      descriptionList:
        - description: To use, place on the floor, hover over the item, and tap E on the keyboard.
          color: "#4f94ad"
          requireDetailRange: true

